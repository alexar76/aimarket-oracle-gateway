name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: MCP entrypoint + Glama manifest
        run: |
          test -f aimarket_oracle_gateway/stdio_server.py
          test -f glama.json
          test -f Dockerfile
          grep -qi "Model Context Protocol" README.md

      - name: Gateway unit tests
        run: |
          pip install pytest
          pip install -e .
          pytest tests/ -q

      - name: Smoke coverage badge
        env:
          AICOM_CI_ENFORCE_BADGE_SYNC: "1"
        run: bash scripts/ci_static_badge.sh checks pass
